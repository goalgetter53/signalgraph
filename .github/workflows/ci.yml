name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test (offline, fixtures only)
        run: pytest
      - name: ER quality on gold set
        run: python scripts/eval_er.py
      - name: Offline demo
        run: |
          signalgraph --db ci.duckdb ingest --fixtures fixtures --today 2026-11-19
          signalgraph --db ci.duckdb resolve
          signalgraph --db ci.duckdb score --as-of 2026-11-19T00:00:00+00:00
          signalgraph --db ci.duckdb export --format hubspot --out hubspot.json

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signalgraph:ci .
